name: Lockgate contract and regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      evaluation_provider:
        description: Offline checks, or one optional Groq proposal
        type: choice
        options:
          - offline
          - groq
        default: offline
      groq_model:
        description: Model allowed by contracts/model.json
        type: choice
        options:
          - openai/gpt-oss-20b
          - llama-3.1-8b-instant
        default: openai/gpt-oss-20b
      profile_case:
        description: Synthetic profile for the single remote proposal
        type: choice
        options:
          - demo-new
          - demo-returning
          - demo-unknown
        default: demo-new

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Harness regression suite
        run: python -m unittest discover -s tests -v
      - name: Demonstrate permitted evidence-backed run
        run: python -m lockgate.cli --mode demo --db runtime/traces.sqlite3 > runtime-summary.json
      - name: Offline proposal replay matrix
        run: python -m lockgate.replay_cli --output-dir runtime/replay > replay-summary.json
      - name: Upload offline replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockgate-offline-replay
          path: |
            replay-summary.json
            runtime/replay/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload local demo audit trail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockgate-demo-trace
          path: |
            runtime-summary.json
            runtime/traces.sqlite3
          if-no-files-found: ignore
          retention-days: 7

  groq-evaluation:
    name: Optional bounded Groq evaluation
    if: github.event_name == 'workflow_dispatch' && inputs.evaluation_provider == 'groq'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Request one bounded proposal on synthetic evidence
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ inputs.groq_model }}
          LOCKGATE_PROFILE: ${{ inputs.profile_case }}
        run: python -m lockgate.model_cli --provider groq --case "$LOCKGATE_PROFILE" --output-dir runtime/remote-model > model-summary.json
      - name: Upload sanitized model outcome and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockgate-optional-model-evaluation
          path: |
            model-summary.json
            runtime/remote-model/
          if-no-files-found: ignore
          retention-days: 7

  retrieve-official-page:
    name: Source and condition evidence chain
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve one official page (E1 only)
        run: python -m lockgate.retrieval_cli --output-dir runtime/snapshots > retrieval-summary.json
      - name: Check trusted claims against snapshot (E2 gate)
        run: python -m lockgate.verification_cli --retrieval-summary retrieval-summary.json > verification-summary.json
      - name: Exercise scoped PASS, FAIL and UNKNOWN decisions (synthetic profiles)
        run: python -m lockgate.decision_cli --retrieval-summary retrieval-summary.json --db runtime/decisions.sqlite3 > runtime/decision-summary.json
      - name: Gate honest planner proposals against live source evidence
        run: python -m lockgate.decision_cli --retrieval-summary retrieval-summary.json --planner-mode seeded-honest --db runtime/planner-decisions.sqlite3 > runtime/planner-summary.json
      - name: Upload source evidence, decisions and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockgate-evidence-chain
          path: |
            retrieval-summary.json
            verification-summary.json
            runtime/decision-summary.json
            runtime/decisions.sqlite3
            runtime/planner-summary.json
            runtime/planner-decisions.sqlite3
            runtime/snapshots/
          if-no-files-found: ignore
          retention-days: 7
